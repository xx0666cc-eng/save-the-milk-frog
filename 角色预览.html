<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色换装 · 动作预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#373c31;font:14px 'Microsoft YaHei',sans-serif}canvas{position:fixed;inset:0;display:block}header{position:fixed;left:32px;top:24px;z-index:2}h1{font-size:25px;font-weight:600;margin:0 0 8px}p{margin:0;color:#696d5e;line-height:1.8}a{color:#515c35}.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:12px;background:#fffdf5ed;border:1px solid #b9b7a6;padding:14px 20px;white-space:nowrap}select,button{font:inherit;color:#373c31;background:#fffdf5;border:1px solid #b9b7a6;padding:8px 12px;cursor:pointer}aside{position:fixed;right:24px;top:24px;z-index:2;width:180px}aside img{width:100%;display:block;border:1px solid #d8d5ca}aside p{font-size:12px;margin-top:6px}button:focus-visible,select:focus-visible{outline:3px solid #796c27;outline-offset:4px}@media(max-width:700px){aside{width:85px;right:12px;top:16px}header{left:16px;top:16px;max-width:235px}h1{font-size:18px}header p{font-size:11px}.controls{flex-wrap:wrap;justify-content:center;white-space:normal;width:94%;gap:8px;padding:10px;bottom:12px}}

.controls{flex-wrap:wrap;justify-content:center;max-width:96vw}#previewStatus{font-size:12px;max-width:230px;white-space:normal}@media(max-width:700px){.controls{gap:6px}select,button{padding:7px 9px}}
</style></head><body><header><h1>角色换装 · 动作预览</h1><p>原版及五套角色形象，动作均使用对应形象素材。<br>当前是二维图片角色，可切换动作和朝向。<br><a href="index.html">进入格斗游戏 →</a></p></header><aside><img id="ref" src="assets/references/standing.jpg" alt="用户提供的角色参考图"><p>原始参考图</p></aside><div class="controls"><label for="skinSelect">形象</label><select id="skinSelect" aria-label="选择角色形象"></select><label for="pose">动作</label><select id="pose"><option value="idle">站立</option><option value="jump">跳跃</option><option value="wave">气流技</option><option value="laugh">大笑</option><option value="run">左右走动</option><option value="walkFront">向前走动</option><option value="walkBack">向后走动</option><option value="guard">防守</option><option value="jab">出拳</option><option value="finisher">踢腿</option><option value="heavy">挑空</option><option value="stun">受击</option><option value="super">必杀</option></select><button id="direction">切换朝向</button><button id="freeze">暂停动作</button><span id="previewStatus" role="status"></span></div><script src="vendor/three.min.js"></script><script src="arena-config.js"></script><script src="morris.js"></script><script src="thunder-beast.js"></script><script src="capital-enemies.js"></script><script src="monsters.js"></script><script src="encounters.js"></script><script src="auto-attack.js"></script><script src="combat.js"></script><script src="assets/character/sprite-data.js"></script><script src="assets/character/walk-data.js"></script><script src="skins.js"></script><script src="ground-indicator.js"></script><script src="creature.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4f1e9');const camera=new THREE.OrthographicCamera(-3,3,4.2,-.6,.1,30);camera.position.set(0,0,8);
const character=new ReferenceFighterView(scene);character.shadow.visible=false;character.body.rotation.x=0;const clock=new THREE.Clock(),pose=document.getElementById('pose'),skinSelect=document.getElementById('skinSelect'),status=document.getElementById('previewStatus');let face=-1,paused=false,time=0,currentSkin=FighterSkins.find('original');
for(const skin of FIGHTER_SKINS){const o=document.createElement('option');o.value=skin.id;o.textContent=skin.name;skinSelect.append(o);}
function reference(){document.getElementById('ref').src=currentSkin.id==='original'?(pose.value==='laugh'?'assets/references/laugh.jpg':'assets/references/standing.jpg'):currentSkin.preview;character.reset();}
async function selectSkin(id){skinSelect.disabled=true;status.textContent='正在准备动作…';try{const skin=FighterSkins.find(id);await character.setSkin(skin);currentSkin=skin;skinSelect.value=skin.id;for(const o of pose.options){if(o.value==='super')o.textContent=skin.weapon==='fan'?'广寒天倾':skin.weapon==='sword'?'千樱断空':skin.weapon==='magic'?'星月天光 · 大招':'必杀';if(o.value==='jab')o.textContent=skin.weapon==='fan'?'清风拂月':skin.weapon==='magic'?'紫色法球':skin.weapon==='sword'?'剑斩':skin.weapon==='bow'?'放箭':'出拳';if(o.value==='finisher')o.textContent=skin.weapon==='fan'?'满月归墟':skin.weapon==='magic'?'第三法球':skin.weapon==='sword'?'终结斩':skin.weapon==='bow'?'第三箭':'踢腿';if(o.value==='heavy')o.textContent=skin.weapon==='fan'?'挑月':skin.weapon==='sword'?'上挑斩':skin.weapon==='bow'?'挑空箭':'挑空';if(o.value==='wave')o.textContent=skin.weapon==='fan'?'流光回旋':skin.weapon==='magic'?'星月气流':skin.weapon==='sword'?'樱影突斩':skin.weapon==='bow'?'蓄力箭':'气流技';}reference();status.textContent='';}catch{skinSelect.value=currentSkin.id;status.textContent='素材加载失败，请重新选择。';}finally{skinSelect.disabled=false;}}
skinSelect.onchange=()=>selectSkin(skinSelect.value);document.getElementById('direction').onclick=()=>face*=-1;document.getElementById('freeze').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动作':'暂停动作';};pose.onchange=reference;
window.onresize=()=>{const a=innerWidth/innerHeight,half=Math.max(2.65,2.65/a);camera.left=-half*a;camera.right=half*a;camera.top=1.95+half;camera.bottom=1.95-half;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};window.onresize();
function animate(){const dt=clock.getDelta();if(!paused)time+=Math.min(dt,.05);const name=pose.value,m=Combat.MOVES[name];character.update({x:0,y:name==='jump'?.5:0,face,hp:120,inv:0,previewMotion:true,walkVX:name==='run'?face*5.3:0,walkVZ:name==='walkFront'?5.3:name==='walkBack'?-5.3:0,intent:{move:name==='run'?face:0,depth:name==='walkFront'?1:name==='walkBack'?-1:0},state:m?'attack':name==='laugh'?'idle':name.startsWith('walk')?'run':name,attack:m?name:null,t:time%1.3,celebrate:name==='laugh'},time);renderer.render(scene,camera);requestAnimationFrame(animate);}animate();window.modelPreview={scene,character,renderer,camera,selectSkin};selectSkin(currentSkin.id);
</script></body></html>
